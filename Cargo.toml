[package]
name = "ferrogram"
version = "0.1.0"
edition = "2024"
description = "Лёгкий десктопный клиент Telegram на Rust + Slint"
publish = false

[dependencies]
# Программный рендерер: без OpenGL-драйвера процесс занимает в разы меньше памяти.
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
# Без фич по умолчанию: сессию храним сами, SQLite (libsql) не нужен.
grammers-client = { version = "0.12.0", default-features = false }
tokio = { version = "1.54", default-features = false, features = ["rt", "sync", "time", "macros"] }
jiff = "0.2.40"

[build-dependencies]
slint-build = "1.18.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
